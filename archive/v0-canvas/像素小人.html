<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seeky &amp; Ocean 像素小人</title>
<style>
  html,body{margin:0;height:100%;background:#f3f1ee;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#4a2a33}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:100vh}
  #stage{display:flex;align-items:flex-end;justify-content:center;gap:40px}
  .who{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;user-select:none}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  .name{font-size:15px;letter-spacing:1px;opacity:.75}
  #ctrl{display:flex;gap:10px}
  #ctrl button{font:inherit;font-size:15px;padding:7px 18px;border-radius:8px;border:1px solid #d9cfd2;background:#fff;color:#4a2a33;cursor:pointer}
  #ctrl button.on{background:#4a2a33;color:#fff;border-color:#4a2a33}
  #ctrl .sep{width:1px;background:#d9cfd2;margin:4px 6px}
</style>
</head>
<body>
<div id="stage">
  <div class="who" data-who="seeky"><canvas></canvas><div class="name">Seeky</div></div>
  <div class="who" data-who="ocean"><canvas></canvas><div class="name">Ocean</div></div>
</div>
<div id="ctrl">
  <button data-mode="idle" class="on">待机</button>
  <button data-mode="cheer">欢呼</button>
  <span class="sep"></span>
  <button data-outfit="peach" class="on">蜜桃套装</button>
  <button data-outfit="overalls">背带裤</button>
  <span class="sep"></span>
  <button data-hair="simple">简单</button>
  <button data-hair="ears">动物耳朵</button>
  <button data-hair="hat" class="on">蜜桃帽</button>
</div>
<script src="data.js"></script>
<script>
(function(){
"use strict";
const DATA=window.PIXEL_DATA;
const CH='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
const pal=DATA.pal.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
// 图层只烘焙一次并复用（同一图层被多帧引用时不重复存像素）
function bakeLayer(l){
  const c=document.createElement('canvas');c.width=l.w;c.height=l.h;
  const x=c.getContext('2d'),img=x.createImageData(l.w,l.h);
  l.rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.')continue;const p=pal[CH.indexOf(ch)],o=(y*l.w+i)*4;img.data[o]=p[0];img.data[o+1]=p[1];img.data[o+2]=p[2];img.data[o+3]=255;}});
  x.putImageData(img,0,0);return {c,w:l.w,h:l.h};
}
const POOL={};
for(const who in DATA.layers){POOL[who]={};for(const k in DATA.layers[who])POOL[who][k]=bakeLayer(DATA.layers[who][k]);}
// a frame = 画布尺寸 + {图层名: [图层键, x, y]}，绘制顺序由 outfits 决定
const S={};
for(const who in DATA.frames){S[who]={};
  for(const fk in DATA.frames[who]){const f=DATA.frames[who][fk],L={};
    for(const n in f.L){const [k,x,y]=f.L[n],b=POOL[who][k];L[n]={c:b.c,x,y,w:b.w,h:b.h};}
    S[who][fk]={w:f.w,h:f.h,ax:f.ax,L};}}
// frame tables: [sprite key, spark key|null, dy (art px, up = negative), ms]
const ANIM=DATA.anims;
const SCALES=[5,4,3,2,1];
let SC=3,W=0,H=0;
function layout(){
  let maxW=0,maxH=0;
  for(const p of SCALES){
    let w=0,h=0;
    for(const who in S){for(const k of ['i0','cb','cs']){w=Math.max(w,S[who][k].w*p);h=Math.max(h,(S[who][k].h+6)*p);}}
    if(w*2+40<=innerWidth-24 && h+110<=innerHeight){SC=p;W=w;H=h;break;}
    SC=p;W=w;H=h;
  }
  document.querySelectorAll('.who canvas').forEach(cv=>{cv.width=W;cv.height=H;cv.style.width=W+'px';cv.style.height=H+'px';});
}
let mode='idle',outfit='peach',hair='hat';
const chars={};
document.querySelectorAll('.who').forEach((el,i)=>{
  const who=el.dataset.who;
  chars[who]={who,el,cv:el.querySelector('canvas'),ctx:el.querySelector('canvas').getContext('2d'),
    delay:i*0.5, // Ocean is half a beat behind
    over:null, overStart:0, blinkUntil:0, nextBlink:1200+i*700+Math.random()*1500};
  const trigger=()=>{const c=chars[who];if(mode!=='cheer'){c.over='cheer';c.overStart=performance.now();}};
  el.addEventListener('mouseenter',trigger);el.addEventListener('click',trigger);
});
function pick(anim,t){
  const tot=anim.reduce((s,f)=>s+f[3],0);let m=((t%tot)+tot)%tot;
  for(const f of anim){if(m<f[3])return f;m-=f[3];}return anim[0];
}
function draw(c,now){
  let a=mode,t;
  if(c.over){const el=now-c.overStart,tot=ANIM.cheer.reduce((s,f)=>s+f[3],0)*2;if(el>=tot)c.over=null;else{a='cheer';t=el;}}
  const beat=ANIM[a].reduce((s,f)=>s+f[3],0)/ANIM[a].length;
  if(t===undefined)t=now-c.delay*beat;
  const f=pick(ANIM[a],t);
  let key=f[0];
  if(key[0]==='i'){
    if(now>c.nextBlink){c.blinkUntil=now+140;c.nextBlink=now+2600+Math.random()*2400;}
    if(now<c.blinkUntil)key+='b';
  }
  const sp=S[c.who][key],s=SC;
  const ctx=c.ctx;ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,W,H);
  const x=Math.round(W/2-sp.ax*s),y=H-sp.h*s+f[2]*s;
  for(const n of DATA.outfits[outfit][c.who].concat(DATA.hair[hair][c.who])){const l=sp.L[n];if(l)ctx.drawImage(l.c,x+l.x*s,y+l.y*s,l.w*s,l.h*s);}
  if(f[1]){const l=S[c.who][f[1]].L.spark;if(l)ctx.drawImage(l.c,x+l.x*s,y+l.y*s,l.w*s,l.h*s);}
  c.cv.dataset.frame=key;
}
function loop(now){for(const w in chars)draw(chars[w],now);requestAnimationFrame(loop);}
function setMode(m){mode=m;for(const w in chars)chars[w].over=null;
  document.querySelectorAll('#ctrl button[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));}
function setOutfit(o){outfit=o; // keeps the current animation running
  document.querySelectorAll('#ctrl button[data-outfit]').forEach(b=>b.classList.toggle('on',b.dataset.outfit===o));}
function setHair(h){hair=h;
  document.querySelectorAll('#ctrl button[data-hair]').forEach(b=>b.classList.toggle('on',b.dataset.hair===h));}
document.querySelectorAll('#ctrl button[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.querySelectorAll('#ctrl button[data-outfit]').forEach(b=>b.addEventListener('click',()=>setOutfit(b.dataset.outfit)));
document.querySelectorAll('#ctrl button[data-hair]').forEach(b=>b.addEventListener('click',()=>setHair(b.dataset.hair)));
addEventListener('resize',layout);
layout();requestAnimationFrame(loop);
window.__setMode=setMode;window.__scale=()=>SC;window.__setOutfit=setOutfit;window.__setHair=setHair;
})();
</script>
</body>
</html>
